<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 452" width="690" height="452"
  font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>HashBrown pipeline: long reads are prepared, assembled and polished; short reads polish them (hybrid) or are assembled on their own; everything ends in QC</title>
  <style>:root { --text: #1d2433; --muted: #5d6678; --box: #f6f7f9; --edge: #d7dbe2; --arrow: #8a93a3; --reads: #8a93a3; --ref: #5d6678 } @media (prefers-color-scheme: dark) { :root { --text: #e6e8ec; --muted: #9aa3b2; --box: #1d2129; --edge: #363c47; --arrow: #737d8e; --reads: #737d8e; --ref: #9aa3b2 } }</style>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--arrow)"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c87f3a"/></marker></defs><text x="165.0" y="20" font-size="12" font-weight="700" text-anchor="middle" fill="var(--muted)">Long reads (Nanopore)</text><text x="525.0" y="20" font-size="12" font-weight="700" text-anchor="middle" fill="var(--muted)">Short reads (Illumina · Ion Torrent)</text><rect x="40" y="34" width="250" height="52" rx="9" fill="var(--box)" stroke="var(--edge)" stroke-width="1.2"/><text x="165.0" y="56" font-size="13" font-weight="700" text-anchor="middle" fill="var(--text)">Prepare</text><text x="165.0" y="74" font-size="11" text-anchor="middle" fill="var(--muted)">Porechop · Filtlong</text><rect x="40" y="120" width="250" height="52" rx="9" fill="var(--box)" stroke="var(--edge)" stroke-width="1.2"/><text x="165.0" y="142" font-size="13" font-weight="700" text-anchor="middle" fill="var(--text)">Assemble</text><text x="165.0" y="160" font-size="11" text-anchor="middle" fill="var(--muted)">Flye or Shasta</text><rect x="40" y="206" width="250" height="52" rx="9" fill="var(--box)" stroke="var(--edge)" stroke-width="1.2"/><text x="165.0" y="228" font-size="13" font-weight="700" text-anchor="middle" fill="var(--text)">Polish (long reads)</text><text x="165.0" y="246" font-size="11" text-anchor="middle" fill="var(--muted)">Medaka · optional</text><rect x="40" y="292" width="250" height="52" rx="9" fill="var(--box)" stroke="var(--edge)" stroke-width="1.2" stroke-dasharray="5 4"/><text x="165.0" y="314" font-size="13" font-weight="700" text-anchor="middle" fill="var(--text)">Polish (short reads)</text><text x="165.0" y="332" font-size="11" text-anchor="middle" fill="var(--muted)">Polypolish → pyPOLCA · hybrid only</text><path d="M165.0,88 L165.0,118" fill="none" stroke="var(--arrow)" stroke-width="1.8" marker-end="url(#ah)"/><path d="M165.0,174 L165.0,204" fill="none" stroke="var(--arrow)" stroke-width="1.8" marker-end="url(#ah)"/><path d="M165.0,260 L165.0,290" fill="none" stroke="var(--arrow)" stroke-width="1.8" marker-end="url(#ah)"/><path d="M165.0,346 L165.0,376" fill="none" stroke="var(--arrow)" stroke-width="1.8" marker-end="url(#ah)"/><rect x="400" y="34" width="250" height="52" rx="9" fill="var(--box)" stroke="var(--edge)" stroke-width="1.2"/><text x="525.0" y="56" font-size="13" font-weight="700" text-anchor="middle" fill="var(--text)">Trim</text><text x="525.0" y="74" font-size="11" text-anchor="middle" fill="var(--muted)">fastp</text><rect x="400" y="120" width="250" height="52" rx="9" fill="var(--box)" stroke="var(--edge)" stroke-width="1.2"/><text x="525.0" y="142" font-size="13" font-weight="700" text-anchor="middle" fill="var(--text)">Assemble</text><text x="525.0" y="160" font-size="11" text-anchor="middle" fill="var(--muted)">SKESA or SPAdes</text><path d="M525.0,88 L525.0,118" fill="none" stroke="var(--arrow)" stroke-width="1.8" marker-end="url(#ah)"/><path d="M525.0,174 L525.0,376" fill="none" stroke="var(--arrow)" stroke-width="1.8" marker-end="url(#ah)"/><text x="533.0" y="284" font-size="11" font-style="italic" fill="var(--muted)">short reads only</text><path d="M398,60 H351.0 Q345.0,60 345.0,66 V312 Q345.0,318 339.0,318 H292" fill="none" stroke="#c87f3a" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ahg)"/><text x="353.0" y="190" font-size="11" font-style="italic" fill="#c87f3a">hybrid</text><rect x="40" y="378" width="610" height="56" rx="9" fill="var(--box)" stroke="var(--edge)" stroke-width="1.2"/><text x="345.0" y="400" font-size="13" font-weight="700" text-anchor="middle" fill="var(--text)">QC — every run</text><text x="345.0" y="418" font-size="11" text-anchor="middle" fill="var(--muted)">QUAST · flagstat · mosdepth · dot plots · assembly graphs</text>
</svg>
