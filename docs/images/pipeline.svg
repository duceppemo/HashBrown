<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 190" width="830" height="190"
  font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>HashBrown pipeline: long reads are prepared, assembled and polished; short reads polish them or are assembled on their own; everything ends in QC</title>
  <style>:root { --text: #1d2433; --muted: #5d6678; --box: #f6f7f9; --edge: #d7dbe2; --arrow: #8a93a3; --reads: #8a93a3; --ref: #5d6678 } @media (prefers-color-scheme: dark) { :root { --text: #e6e8ec; --muted: #9aa3b2; --box: #1d2129; --edge: #363c47; --arrow: #737d8e; --reads: #737d8e; --ref: #9aa3b2 } }</style>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--arrow)"/></marker></defs><text x="80" y="16" font-size="12" font-weight="700" fill="var(--muted)">Long reads (Nanopore)</text><rect x="20" y="24" width="120" height="50" rx="8" fill="var(--box)" stroke="var(--edge)"/><text x="80.0" y="46" font-size="13" font-weight="700" text-anchor="middle" fill="var(--text)">1 Prepare</text><text x="80.0" y="64" font-size="11" text-anchor="middle" fill="var(--muted)">Porechop · Filtlong</text><rect x="170" y="24" width="120" height="50" rx="8" fill="var(--box)" stroke="var(--edge)"/><text x="230.0" y="46" font-size="13" font-weight="700" text-anchor="middle" fill="var(--text)">2 Assemble</text><text x="230.0" y="64" font-size="11" text-anchor="middle" fill="var(--muted)">Flye or Shasta</text><rect x="320" y="24" width="120" height="50" rx="8" fill="var(--box)" stroke="var(--edge)"/><text x="380.0" y="46" font-size="13" font-weight="700" text-anchor="middle" fill="var(--text)">3 Polish long</text><text x="380.0" y="64" font-size="11" text-anchor="middle" fill="var(--muted)">Medaka (or none)</text><rect x="470" y="24" width="150" height="50" rx="8" fill="var(--box)" stroke="var(--edge)"/><text x="545.0" y="46" font-size="13" font-weight="700" text-anchor="middle" fill="var(--text)">4 Polish short</text><text x="545.0" y="64" font-size="11" text-anchor="middle" fill="var(--muted)">Polypolish → pyPOLCA</text><path d="M140,49 L168,49" stroke="var(--arrow)" stroke-width="1.8" marker-end="url(#ah)"/><path d="M290,49 L318,49" stroke="var(--arrow)" stroke-width="1.8" marker-end="url(#ah)"/><path d="M440,49 L468,49" stroke="var(--arrow)" stroke-width="1.8" marker-end="url(#ah)"/><path d="M620,49 L658,84" stroke="var(--arrow)" stroke-width="1.8" marker-end="url(#ah)"/><text x="80" y="112" font-size="12" font-weight="700" fill="var(--muted)">Short reads (Illumina, Ion Torrent)</text><rect x="20" y="120" width="120" height="50" rx="8" fill="var(--box)" stroke="var(--edge)"/><text x="80.0" y="142" font-size="13" font-weight="700" text-anchor="middle" fill="var(--text)">Trim</text><text x="80.0" y="160" font-size="11" text-anchor="middle" fill="var(--muted)">fastp</text><rect x="170" y="120" width="120" height="50" rx="8" fill="var(--box)" stroke="var(--edge)"/><text x="230.0" y="142" font-size="13" font-weight="700" text-anchor="middle" fill="var(--text)">Assemble</text><text x="230.0" y="160" font-size="11" text-anchor="middle" fill="var(--muted)">SKESA or SPAdes</text><path d="M140,145 L168,145" stroke="var(--arrow)" stroke-width="1.8" marker-end="url(#ah)"/><path d="M140,132 L468,62" stroke="var(--arrow)" stroke-width="1.8" marker-end="url(#ah)"/><path d="M290,145 L658,116" stroke="var(--arrow)" stroke-width="1.8" marker-end="url(#ah)"/><rect x="662" y="70" width="150" height="60" rx="8" fill="var(--box)" stroke="var(--edge)"/><text x="737.0" y="92" font-size="13" font-weight="700" text-anchor="middle" fill="var(--text)">QC</text><text x="737.0" y="110" font-size="11" text-anchor="middle" fill="var(--muted)">QUAST · Qualimap ·</text><text x="737" y="124" font-size="11" text-anchor="middle" fill="var(--muted)">dot plots · coverage · graphs</text>
</svg>
