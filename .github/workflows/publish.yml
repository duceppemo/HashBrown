name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.1.0)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          pkg=$(python -c "import hashbrown; print(hashbrown.__version__)")
          proj=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${TAG#v}"
          test "$pkg" = "$tag" || { echo "::error::tag $tag != __version__ $pkg"; exit 1; }
          test "$proj" = "$tag" || { echo "::error::tag $tag != pyproject version $proj"; exit 1; }
      - uses: pypa/gh-action-pypi-publish@release/v1
