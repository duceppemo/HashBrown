[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hashbrown-assembly"
# Static on purpose: tests/test_cli.py keeps this in sync with hashbrown.__version__.
version = "1.0.0"
description = "Long-read, short-read and hybrid bacterial genome assembly pipeline."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Marc-Olivier Duceppe" }]
requires-python = ">=3.10"
dependencies = ["psutil>=5.9"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=5", "ruff", "pre-commit"]

[project.urls]
Homepage = "https://github.com/duceppemo/HashBrown"
Documentation = "https://github.com/duceppemo/HashBrown/wiki"

[project.scripts]
hashbrown = "hashbrown.cli:main"

[tool.setuptools]
packages = ["hashbrown"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["hashbrown"]

[tool.ruff]
line-length = 115
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"docs/images/make_svgs.py" = ["E501"]  # SVG markup lines
