# mamba env create -f environment.yml && conda activate HashBrown && pip install .
name: HashBrown
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.10
  - psutil>=5.9
  # Long reads
  - flye>=2.9           # long read assembly (-a flye, the default)
  - shasta>=0.11        # long read assembly (-a shasta)
  - medaka>=2.0         # long read polishing (PyTorch build: no more TensorFlow conflicts)
  - porechop>=0.2.4     # long read adapter trimming (--trim-long)
  - filtlong>=0.2.1     # long read filtering (--filter-long)
  - seqtk>=1.4          # fastq to fasta for Shasta, fasta normalization
  # Short reads
  - skesa>=2.5          # short read assembly (-a skesa); also provides gfa_connector for the graphs
  - spades>=3.15        # short read assembly (-a spades)
  - fastp>=0.23         # short read trimming (--trim-short)
  - bwa>=0.7.17         # short read mapping for Polypolish
  - polypolish>=0.6     # short read polishing
  - pypolca>=0.3        # short read polishing (run with --careful)
  # QC
  - samtools>=1.17
  - minimap2>=2.26
  - quast>=5.2          # assembly metrics
  - qualimap>=2.2.2     # mapping QC
  - mummer4>=4.0.0rc1   # nucmer dot plots: polishing before/after
  - gnuplot>=5.4        # mummerplot rendering
  - bandage>=0.8.1      # optional: pictures of the assembly graphs
  - pip
